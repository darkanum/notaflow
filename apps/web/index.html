<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotaFlow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The Malphas theme init (layout/base.templ): the saved theme applies before the first paint. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('malphas-theme');
          if (t) document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen bg-surface text-fg font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
